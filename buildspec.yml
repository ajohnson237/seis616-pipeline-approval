version: 0.2

# Same build as class. The runtime-versions block (nodejs 14 / python 3.9) was removed because
# those runtimes are no longer offered on current CodeBuild images; the image defaults are used.
phases:
  pre_build:
    commands:
      - echo Test the python application.
      - pip install -r requirements.txt
      - pip install -U pytest
      - pytest
  build:
    commands:
      - echo Build the CSS using less.
      - npm install -g less
      - mkdir -p static/css
      - lessc styles.less static/css/styles.css

artifacts:
  files:
    - '**/*'
  name: python-app-$(date +%y%m%d%H%M).zip
